spring.application.name=pedidosDeAlmacen


# Configuración para MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/pedidos_almacen_db?serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=1234

# Hibernate se encarga de crear las tablas por vos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto actualizado para versiones 8 o 9
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect